name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch the Pages source
        run: |
          mkdir pages-source
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/index.html" \
            --output pages-source/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-source
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            if count="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              -f name="$PAGES_ARTIFACT_NAME" --jq '.total_count')" && [ "$count" = 1 ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::The uploaded Pages artifact did not become visible"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
